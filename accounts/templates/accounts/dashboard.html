<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

    <h1>Welcome, {{ user.username }}</h1>

    <p>Role: {{ user_role }}</p>

    {% if shop %}
        <p>Shop: {{ shop.name }}</p>
    {% else %}
        <p>No shop assigned.</p>
    {% endif %}

    <a href="{% url 'logout' %}">Logout</a>

</body>
</html>
